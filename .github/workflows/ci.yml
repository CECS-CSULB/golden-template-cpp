name: CI

# Student-facing feedback loop. This workflow builds the same project and runs
# the same tests that the autograder should run.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_COMMIT: e5a1490e1409d175932ef6014519e9ae149ddb7c

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Install vcpkg
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure with CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the Verification Log was filled in
        if: always()
        shell: bash
        run: |
          if grep -qE '^Name:\s*$' VERIFICATION-LOG.md 2>/dev/null; then
            echo "::warning file=VERIFICATION-LOG.md::Verification Log is not signed — fill it in before your final push."
          fi
